<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Edit Server</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<main class="container py-5">
		<section class="card shadow-sm mx-auto" style="max-width: 40rem;">
			<div class="card-body p-4">
				<h1 class="h3 mb-4">Edit Server</h1>
				<form method="POST" action="/edit/{{ server.id }}">
					<div class="mb-3">
						<label for="name" class="form-label">Name</label>
						<input type="text" class="form-control" id="name" name="name" value="{{ server.name }}" required>
					</div>
					<div class="mb-3">
						<label for="ip_address" class="form-label">IP address</label>
						<input type="text" class="form-control" id="ip_address" name="ip_address" value="{{ server.ip_address }}" required>
					</div>
					<div class="mb-4">
						<label for="status" class="form-label">Status</label>
						<select class="form-select" id="status" name="status" required>
							<option value="online" {% if server.status == "online" %}selected{% endif %}>Online</option>
							<option value="offline" {% if server.status == "offline" %}selected{% endif %}>Offline</option>
							<option value="maintenance" {% if server.status == "maintenance" %}selected{% endif %}>Maintenance</option>
						</select>
					</div>
					<button type="submit" class="btn btn-primary">Save changes</button>
					<a href="/" class="btn btn-secondary">Cancel</a>
				</form>
			</div>
		</section>
	</main>
</body>
</html>
